
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Encabezado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #40CFFF;
            color: #00334D;
            text-align: center;
        }

        header {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 10px;
            background: linear-gradient(135deg, #65E5FF, #00BFFF, #87F5FF);
        }

        header img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: white;
            border-radius: 50%;
            padding: 5px;
        }

        h1 {
            font-size: 30px;
            margin: 0;
            font-weight: bold;
            text-shadow: 1px 1px 3px white;
        }

        footer {
            height: 20vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #00BFFF;
            color: #00334D;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            border-top: 3px solid #BDF8FF;
        }
    </style>
</head>

<body>

    <header>
        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQb1wIaeK2OrPbtL0wD2s20eGM-k7CU1K2UEjkvrhgSpg&s=10"
            alt="Logo del colegio">

        <h1>UNIDAD EDUCATIVA<br>PROVINCIA DE BOLÍVAR</h1>
    </header>

    <footer>
        PRODUCTOS ESPECIALES
    </footer>

</body>

</html>
